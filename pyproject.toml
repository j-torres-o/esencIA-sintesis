[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video_to_notes_app"
dynamic = ["version"]
description = "esencIA - Síntesis de Vídeo Académico local usando Ollama y Whisper"
readme = "README.md"
authors = [
    { name = "esencIA Team" }
]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "moviepy>=2.0.0",
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "faster-whisper>=1.0.0",
    "requests>=2.31.0",
    "markdown>=3.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pyinstaller>=6.0.0"
]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "W293", "N802", "N803"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests"
]
pythonpath = [
    ".",
    "src"
]
